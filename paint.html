<!DOCTYPE html>
<html>
<head>
    <title>32x32 VGA Pixel Painter</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #333; color: white; }
        #canvas { border: 2px solid #fff; cursor: crosshair; image-rendering: pixelated; }
        .controls { margin: 20px; display: flex; gap: 10px; }
        .palette { display: grid; grid-template-columns: repeat(8, 30px); gap: 5px; margin-bottom: 20px; }
        .color-btn { width: 30px; height: 30px; border: 2px solid #000; cursor: pointer; }
    </style>
</head>
<body>

    <h2>32x32 VGA Painter</h2>
    
    <div class="palette" id="palette"></div>
    
    <canvas id="canvas" width="32" height="32" style="width: 320px; height: 320px;"></canvas>

    <div class="controls">
        <button onclick="saveFile()">Download CSV</button>
        <input type="file" id="fileInput" accept=".csv" onchange="loadFile(event)" style="display:none">
        <button onclick="document.getElementById('fileInput').click()">Load CSV</button>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const paletteDiv = document.getElementById('palette');
    
    // VGA 16-color palette
    const colors = [
        '#000000', '#0000AA', '#00AA00', '#00AAAA', 
        '#AA0000', '#AA00AA', '#AA5500', '#AAAAAA', 
        '#555555', '#5555FF', '#55FF55', '#55FFFF', 
        '#FF5555', '#FF55FF', '#FFFF55', '#FFFFFF'
    ];

    let currentColor = colors[0];
    let grid = Array(32).fill().map(() => Array(32).fill(colors[0]));

    // Initialize UI
    colors.forEach(c => {
        const div = document.createElement('div');
        div.className = 'color-btn';
        div.style.backgroundColor = c;
        div.onclick = () => currentColor = c;
        paletteDiv.appendChild(div);
    });

    // Draw logic
    function draw() {
        for(let y=0; y<32; y++) {
            for(let x=0; x<32; x++) {
                ctx.fillStyle = grid[y][x];
                ctx.fillRect(x, y, 1, 1);
            }
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / 10);
        const y = Math.floor((e.clientY - rect.top) / 10);
        grid[y][x] = currentColor;
        draw();
    });

    function saveFile() {
        const csvContent = grid.map(row => row.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'art.csv';
        a.click();
    }

    function loadFile(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const rows = e.target.result.split('\n');
            grid = rows.map(row => row.split(','));
            draw();
        };
        reader.readAsText(file);
    }

    draw();
</script>
</body>
</html>
